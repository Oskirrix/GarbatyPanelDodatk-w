name: Patch temporary Render host

on:
  push:
    paths:
      - 'scripts/patch-temp-render-host.py'
      - '.github/workflows/patch-temp-render-host.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch loader host
        run: python3 scripts/patch-temp-render-host.py

      - name: Verify host and version
        run: |
          grep -q "https://garbaty-panel-api-rw39.onrender.com" "Garbaty Panel.user.js"
          ! grep -q "https://garbaty-panel-api.onrender.com" "Garbaty Panel.user.js"
          grep -q "@version      6.10.3" "Garbaty Panel.user.js"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Garbaty Panel.user.js"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: point loader to temporary Render service"
          git push
