name: Build loader 6.10.6 cache

on:
  push:
    paths:
      - '.github/scripts/build-loader-6.10.6-cache.js'
      - '.github/workflows/build-loader-6.10.6-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install obfuscator
        run: npm install --no-save javascript-obfuscator@4
      - name: Build loader
        run: node .github/scripts/build-loader-6.10.6-cache.js
      - name: Commit loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Garbaty Panel.user.js" loader-version.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "perf: start panel from local cache"
          git push
