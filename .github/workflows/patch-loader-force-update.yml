name: Patch loader forced update

on:
  push:
    paths:
      - 'scripts/patch-loader-force-update.py'
      - '.github/workflows/patch-loader-force-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch loader
        run: python3 scripts/patch-loader-force-update.py

      - name: Verify loader
        run: |
          grep -q '@version      6.10.4' 'Garbaty Panel.user.js'
          grep -q 'GARBATY_FORCE_UPDATE_V1' 'Garbaty Panel.user.js'
          grep -q 'AKTUALIZUJ PANEL' 'Garbaty Panel.user.js'
          grep -q 'loader-version.json' 'Garbaty Panel.user.js'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Garbaty Panel.user.js'
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'feat: add forced loader update flow'
          git push
